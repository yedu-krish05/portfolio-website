<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const img = new Image();
    // Cache bust to load original
    img.src = './new.jpeg?v=' + Date.now();
    img.onload = () => {
      const c = document.getElementById('c');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.lineWidth = 1;
      ctx.font = 'bold 16px Arial';
      
      for(let x=0; x<img.width; x+=50) {
        for(let y=0; y<img.height; y+=50) {
          ctx.strokeRect(x, y, 50, 50);
          
          // Draw text outline for visibility
          ctx.strokeStyle = 'black';
          ctx.lineWidth = 3;
          ctx.strokeText(`${x},${y}`, x+2, y+16);
          
          ctx.fillStyle = 'yellow';
          ctx.fillText(`${x},${y}`, x+2, y+16);
          ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
          ctx.lineWidth = 1;
        }
      }
    };
  </script>
</body>
</html>
