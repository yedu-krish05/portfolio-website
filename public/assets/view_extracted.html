<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #333; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const img = new Image();
    img.src = './extracted_0.png';
    img.onload = () => {
      const c = document.getElementById('c');
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
    };
  </script>
</body>
</html>
